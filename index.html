<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Airtory Creative Agent</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="app">
    <header>
      <span class="logo">airtory</span>
      <span class="subtitle">Creative Agent</span>
      <button type="button" id="refresh-btn" title="Wipe this conversation and start fresh">
        ↻ Refresh
      </button>
    </header>

    <main id="chat-window"></main>

    <form id="chat-form">
      <button type="button" id="upload-btn" title="Upload an image">📎</button>
      <input type="file" id="file-input" accept="image/*" style="display: none;" />
      <textarea
        id="chat-input"
        rows="1"
        placeholder="Type here. Press Enter to send, Shift+Enter for a new line."
      ></textarea>
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="chat.js?v=4"></script>
</body>
</html>
